name: stage-cases

# Writes the next unicode stage generation of plurimath-testsuite with
# scripts/stage_cases.rb (raw-tree rows from Umath::RawParser on the
# Ruby and native engines) in two independent runs, requires both to write the
# same bytes, checks the result with the testsuite's own validators and
# uploads it as the stage-generation artifact. The testsuite PR copies that
# artifact unchanged. The typed-model generation (--boundary typed-model,
# typed models from Umath.parse) is written the same way from
# MODEL_TESTSUITE_COMMIT and uploaded as stage-generation-model.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      testsuite_commit:
        description: plurimath-testsuite commit holding the source generation
        required: false

permissions:
  contents: read

env:
  # plurimath-testsuite main holding unicode generation 1 (layout revision 1):
  # the generator writes the generation after the latest one, so it reads
  # the commit before the pinned generation 2.
  TESTSUITE_COMMIT: ${{ inputs.testsuite_commit || 'b4520d8041efe8546aa10d6ce4b59d56b8d9ffac' }}
  # The commit pinned in spec/fixtures/testsuite-pin.yml (a step checks it).
  # The payloads written from generation 1 must equal generation 4's
  # there byte for byte (generation 4 holds the umath-named raw-tree rows;
  # the pinned generation 5 keeps them unchanged).
  PINNED_COMMIT: 6138a102589093cdb3587334ff312ece5f17e428
  # plurimath-testsuite main whose latest unicode generation (2) is the
  # source of the typed-model generation.
  MODEL_TESTSUITE_COMMIT: ${{ inputs.testsuite_commit || '5e328516995cbf2917b6968eae627d377fbfa373' }}

jobs:
  spec:
    name: stage-cases specs (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.2", "3.3", "3.4" ]
    env:
      UMATH_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec spec/stage_cases

  generate:
    name: generate the next unicode generation (run ${{ matrix.run }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Two independent runs; the validate job requires equal bytes.
        run: [ 1, 2 ]
    steps:
      - uses: actions/checkout@v4
      # The Ruby the committed artifact records, so the producer block names
      # the Ruby whose Unicode tables built the grammar.
      - name: Use the Ruby the committed artifact records
        run: echo "ARTIFACT_RUBY=$(jq -r '.unicode_tables' artifacts/umath.json | sed -n 's/^onigmo (Ruby \(.*\))$/\1/p')" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.ARTIFACT_RUBY }}
          bundler-cache: true
      - uses: actions/checkout@v4
        with:
          repository: plurimath/plurimath-testsuite
          ref: ${{ env.TESTSUITE_COMMIT }}
          path: testsuite
          persist-credentials: false
      - name: Write the generation
        run: >-
          bundle exec ruby scripts/stage_cases.rb
          --testsuite "$GITHUB_WORKSPACE/testsuite"
          --out "$RUNNER_TEMP/stage-generation"
      - uses: actions/upload-artifact@v4
        with:
          name: stage-generation-run-${{ matrix.run }}
          path: ${{ runner.temp }}/stage-generation
          if-no-files-found: error

  validate:
    name: compare both runs and validate the generation
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stage-generation-run-1
          path: run-1
      - uses: actions/download-artifact@v4
        with:
          name: stage-generation-run-2
          path: run-2
      - name: Require both runs to write the same bytes
        run: diff -r run-1 run-2
      - uses: actions/checkout@v4
        with:
          path: umath
          persist-credentials: false
      - name: Check PINNED_COMMIT matches spec/fixtures/testsuite-pin.yml
        run: |
          pinned=$(awk '$1 == "commit:" { print $2 }' umath/spec/fixtures/testsuite-pin.yml)
          test "$pinned" = "$PINNED_COMMIT" || { echo "PINNED_COMMIT=$PINNED_COMMIT but the pin has $pinned"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: plurimath/plurimath-testsuite
          ref: ${{ env.PINNED_COMMIT }}
          path: pinned
          persist-credentials: false
      - name: Require the raw-tree payloads to equal the pinned generation's
        if: ${{ !inputs.testsuite_commit }}
        run: |
          written=run-1/stages/unicode/generations/000002/payloads
          pinned=pinned/stages/unicode/generations/000004/payloads
          ls "$written"/raw-*.yaml > /dev/null
          for f in "$written"/*.yaml; do
            cmp "$f" "$pinned/$(basename "$f")"
          done
          test "$(cd "$written" && ls raw-*.yaml | sort)" = "$(cd "$pinned" && ls raw-*.yaml | sort)"
      - uses: actions/checkout@v4
        with:
          repository: plurimath/plurimath-testsuite
          ref: ${{ env.TESTSUITE_COMMIT }}
          path: testsuite
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Validate it with the testsuite's validators
        run: |
          cp -R run-1/. testsuite/
          cd testsuite
          ruby scripts/validate.rb
          ruby scripts/validate-stages.rb --base HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: stage-generation
          path: run-1
          if-no-files-found: error

  generate-model:
    name: generate the typed-model unicode generation (run ${{ matrix.run }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Two independent runs; the validate-model job requires equal bytes.
        run: [ 1, 2 ]
    steps:
      - uses: actions/checkout@v4
      - name: Use the Ruby the committed artifact records
        run: echo "ARTIFACT_RUBY=$(jq -r '.unicode_tables' artifacts/umath.json | sed -n 's/^onigmo (Ruby \(.*\))$/\1/p')" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.ARTIFACT_RUBY }}
          bundler-cache: true
      - uses: actions/checkout@v4
        with:
          repository: plurimath/plurimath-testsuite
          ref: ${{ env.MODEL_TESTSUITE_COMMIT }}
          path: testsuite
          persist-credentials: false
      - name: Write the typed-model generation
        run: >-
          bundle exec ruby scripts/stage_cases.rb
          --testsuite "$GITHUB_WORKSPACE/testsuite"
          --out "$RUNNER_TEMP/stage-generation-model"
          --boundary typed-model
      - uses: actions/upload-artifact@v4
        with:
          name: stage-generation-model-run-${{ matrix.run }}
          path: ${{ runner.temp }}/stage-generation-model
          if-no-files-found: error

  validate-model:
    name: compare both typed-model runs and validate the generation
    needs: generate-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stage-generation-model-run-1
          path: run-1
      - uses: actions/download-artifact@v4
        with:
          name: stage-generation-model-run-2
          path: run-2
      - name: Require both runs to write the same bytes
        run: diff -r run-1 run-2
      - uses: actions/checkout@v4
        with:
          repository: plurimath/plurimath-testsuite
          ref: ${{ env.MODEL_TESTSUITE_COMMIT }}
          path: testsuite
          persist-credentials: false
      - name: Require every source payload to be copied byte for byte
        run: |
          source=$(ls -d testsuite/stages/unicode/generations/* | sort | tail -1)
          written=$(ls -d run-1/stages/unicode/generations/* | sort | tail -1)
          for f in "$source"/payloads/*.yaml; do
            cmp "$f" "$written/payloads/$(basename "$f")"
          done
          ls "$written"/payloads/model-*.yaml > /dev/null
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Validate it with the testsuite's validators
        run: |
          cp -R run-1/. testsuite/
          cd testsuite
          ruby scripts/validate.rb
          ruby scripts/validate-stages.rb --base HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: stage-generation-model
          path: run-1
          if-no-files-found: error
