name: test

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  oracle-harness:
    name: oracle harness specs (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.2", "3.3", "3.4" ]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec spec/oracle

  artifact:
    name: grammar and artifact regeneration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The envelope records the compiler and the Ruby whose Unicode tables
      # it was built with; rebuilding with either changed changes its bytes.
      - name: Use the compiler and Ruby the committed artifact records
        run: |
          echo "PARSANOL_VERSION=$(awk '$1 == "compiler_version" { print $2 }' artifacts/unicodemath.checksums.txt)" >> "$GITHUB_ENV"
          echo "ARTIFACT_RUBY=$(jq -r '.unicode_tables' artifacts/unicodemath.json | sed -n 's/^onigmo (Ruby \(.*\))$/\1/p')" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.ARTIFACT_RUBY }}
          bundler-cache: true
      - name: Regenerate the grammar, compile twice, rewrite the manifest
        run: bundle exec ruby scripts/compile.rb --determinism
      - name: Check the artifact against its source
        run: bundle exec parsanol parg check --source grammars/unicodemath.parg --artifact artifacts/unicodemath.json
      - name: Require the committed files to equal the regenerated ones
        run: git diff --exit-code -- grammars artifacts

  parser:
    name: artifact and parser specs (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.2", "3.3", "3.4" ]
    env:
      # Parsanol ships a precompiled native extension for x86_64 Linux;
      # fail instead of skipping the native-engine examples if it is missing.
      UNICODEMATH_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec spec/artifact spec/parser

  gem:
    name: gem build and installed smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: gem build unicodemath.gemspec
      - name: Install the built gem alone and parse with it
        run: |
          export GEM_HOME="$RUNNER_TEMP/gems"
          gem install --no-document ./unicodemath-*.gem
          cd "$RUNNER_TEMP"
          ruby -e '
            require "unicodemath"
            r = Unicodemath::RawParser.parse("a/b", engine: :ruby)
            abort "unexpected tree #{r.tree.inspect}" unless r.tree.key?(:frac)
            abort "loaded from the checkout" unless $LOADED_FEATURES.grep(%r{/unicodemath\.rb\z}).first.start_with?(ENV["GEM_HOME"])
            puts "ok #{r.tree.keys.inspect} #{Unicodemath.artifact_paths.first}"
          '

  oracle-smoke:
    name: oracle smoke capture
    runs-on: ubuntu-latest
    env:
      ORACLE_COMMIT: e7ab4a5186c9be96f62d670574bc2c72f9365ad4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: plurimath/plurimath
          ref: ${{ env.ORACLE_COMMIT }}
          path: oracle
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install the oracle bundle from its lockfile
        run: bundle install
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/scripts/oracle/Gemfile
          BUNDLE_PATH: ${{ github.workspace }}/vendor/oracle-bundle
          BUNDLE_FROZEN: "true"
      - name: Capture the smoke rows
        run: >-
          bundle exec ruby scripts/oracle/capture.rb
          --oracle "$GITHUB_WORKSPACE/oracle"
          --ids smoke-success,smoke-refusal
          --out "$RUNNER_TEMP/oracle-smoke"
      - name: Compare with the committed smoke rows
        run: |
          for id in smoke-success smoke-refusal; do
            jq -S '.outcome, .result.boundaries' "corpora/oracle/smoke/rows/$id.json" > "$RUNNER_TEMP/expected-$id.json"
            jq -S '.outcome, .result.boundaries' "$RUNNER_TEMP/oracle-smoke/rows/$id.json" > "$RUNNER_TEMP/actual-$id.json"
            diff -u "$RUNNER_TEMP/expected-$id.json" "$RUNNER_TEMP/actual-$id.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-smoke
          path: ${{ runner.temp }}/oracle-smoke
