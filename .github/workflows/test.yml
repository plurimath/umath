name: test

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  oracle-harness:
    name: oracle harness specs (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.2", "3.3", "3.4" ]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec spec/oracle

  artifact:
    name: grammar and artifact regeneration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The envelope records the compiler and the Ruby whose Unicode tables
      # it was built with; rebuilding with either changed changes its bytes.
      - name: Use the compiler and Ruby the committed artifact records
        run: |
          echo "PARSANOL_VERSION=$(awk '$1 == "compiler_version" { print $2 }' artifacts/umath.checksums.txt)" >> "$GITHUB_ENV"
          echo "ARTIFACT_RUBY=$(jq -r '.unicode_tables' artifacts/umath.json | sed -n 's/^onigmo (Ruby \(.*\))$/\1/p')" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.ARTIFACT_RUBY }}
          bundler-cache: true
      - name: Check the normalized grammar, wrapper table and normalized rules against the export
        run: ruby scripts/generate_grammar.rb --check
      - name: Check the generated model classes against the normalized rules
        run: ruby scripts/generate_model.rb --check
      - name: Regenerate the grammar, compile twice, rewrite the manifest
        run: bundle exec ruby scripts/compile.rb --determinism
      - name: Check the artifact against its source
        run: bundle exec parsanol parg check --source grammars/umath.parg --artifact artifacts/umath.json
      - name: Require the committed files to equal the regenerated ones
        run: git diff --exit-code -- grammars artifacts lib/umath/model/nodes.rb

  parser:
    name: artifact and parser specs (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.2", "3.3", "3.4" ]
    env:
      # Parsanol ships a precompiled native extension for x86_64 Linux;
      # fail instead of skipping the native-engine examples if it is missing.
      UMATH_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec spec/artifact spec/parser

  model:
    name: typed model, standalone and LML specs (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.2", "3.3", "3.4" ]
    env:
      UMATH_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec spec/model spec/standalone
      - name: Verify the exported LML declarations and checksums
        run: bundle exec ruby scripts/verify_lml.rb
      - name: Replay the staged model corpus (raw and model boundaries)
        run: bundle exec ruby scripts/replay_corpus.rb --staging corpora/model --boundary raw,model

  docs:
    name: generated UTN 28 coverage table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # The script checks the checkout against the pin before reading it.
      - name: Read the pinned testsuite commit
        id: pin
        run: echo "commit=$(ruby -ryaml -e 'puts YAML.safe_load_file("spec/fixtures/testsuite-pin.yml").fetch("commit")')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: plurimath/plurimath-testsuite
          ref: ${{ steps.pin.outputs.commit }}
          path: tmp/testsuite
          persist-credentials: false
      - name: Require docs/unicodemath.adoc to match the coverage it states
        run: bundle exec ruby scripts/utn28_coverage.rb --check
      - run: bundle exec rspec spec/docs

  gem:
    name: gem build and installed smoke test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.2", "3.4" ]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: gem build umath.gemspec
      - name: The gem holds only what it needs at run time
        run: |
          gem spec ./umath-*.gem files | sed -n 's/^- //p' | sort > "$RUNNER_TEMP/files.txt"
          cat "$RUNNER_TEMP/files.txt"
          unexpected=$(grep -Ev '^(lib/.*\.rb|artifacts/umath\.json|artifacts/umath\.bindings\.ruby\.json|data/umath-symbols\.json|schema/(umath\.bundle|manifest)\.json|docs/[^/]+\.adoc|README\.adoc|CHANGELOG\.md|LICENSE\.md)$' "$RUNNER_TEMP/files.txt" || true)
          test -z "$unexpected" || { echo "unexpected files: $unexpected"; exit 1; }
          for f in lib/umath.rb lib/umath/model/nodes.rb artifacts/umath.json artifacts/umath.bindings.ruby.json data/umath-symbols.json lib/umath/schema.rb schema/umath.bundle.json schema/manifest.json LICENSE.md; do
            grep -qx "$f" "$RUNNER_TEMP/files.txt" || { echo "missing $f"; exit 1; }
          done
      - name: Install the built gem alone and parse with it
        run: |
          export GEM_HOME="$RUNNER_TEMP/gems" GEM_PATH="$RUNNER_TEMP/gems"
          gem install --no-document ./umath-*.gem
          cd "$RUNNER_TEMP"
          ruby -rumath -e '
            abort "plurimath loaded" if defined?(Plurimath) || !$LOADED_FEATURES.grep(%r{/plurimath[/.]}).empty?
            abort "loaded from the checkout" unless $LOADED_FEATURES.grep(%r{/umath\.rb\z}).first.start_with?(ENV["GEM_HOME"])
            d = Umath.parse("a/b", engine: :ruby)
            abort "unexpected model #{d.inspect}" unless d.expression.frac.is_a?(Umath::Model::Frac)
            abort "symbols unresolved" unless d.expression.frac.numerator.atom.alphanumeric.kind
            empty = Umath.parse("", engine: :ruby)
            abort "empty input #{empty.inspect}" unless empty.is_a?(Umath::Model::Document) && empty.expression.nil?
            require "umath/schema"
            abort "incomplete schema" unless Umath::Schema.bundle.fetch("models").size == 75
            p Umath.parse("a/b")
            abort "plurimath loaded" if defined?(Plurimath)
            puts "ok #{Umath::VERSION} #{Umath.last_engine} #{d.to_json} #{Umath.artifact_paths.first}"
          '

  oracle-smoke:
    name: oracle smoke capture
    runs-on: ubuntu-latest
    env:
      ORACLE_COMMIT: e7ab4a5186c9be96f62d670574bc2c72f9365ad4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: plurimath/plurimath
          ref: ${{ env.ORACLE_COMMIT }}
          path: oracle
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install the oracle bundle from its lockfile
        run: bundle install
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/scripts/oracle/Gemfile
          BUNDLE_PATH: ${{ github.workspace }}/vendor/oracle-bundle
          BUNDLE_FROZEN: "true"
      - name: Capture the smoke rows
        run: >-
          bundle exec ruby scripts/oracle/capture.rb
          --oracle "$GITHUB_WORKSPACE/oracle"
          --ids smoke-success,smoke-refusal
          --out "$RUNNER_TEMP/oracle-smoke"
      - name: Compare with the committed smoke rows
        run: |
          for id in smoke-success smoke-refusal; do
            jq -S '.outcome, .result.boundaries' "corpora/oracle/smoke/rows/$id.json" > "$RUNNER_TEMP/expected-$id.json"
            jq -S '.outcome, .result.boundaries' "$RUNNER_TEMP/oracle-smoke/rows/$id.json" > "$RUNNER_TEMP/actual-$id.json"
            diff -u "$RUNNER_TEMP/expected-$id.json" "$RUNNER_TEMP/actual-$id.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-smoke
          path: ${{ runner.temp }}/oracle-smoke
