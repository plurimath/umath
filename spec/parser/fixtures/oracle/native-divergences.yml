# Fixture rows where the Parsanol native engine (1.3.131) gives a different
# raw tree than the Ruby engine and the legacy oracle: it takes another
# alternative of the same grammar, for example expr: {operator, expr: ...}
# where the Ruby engine and legacy give expr: {operator, expression: ...}.
# The native trees are the same with the grammar before the capture-shape
# normalization (origin/main 1929f69), so this is an engine difference, not
# a normalization one. The parity spec and scripts/replay_corpus.rb require
# these rows to still differ on the native engine; remove an id when it
# starts to match.
